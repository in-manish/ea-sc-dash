features:
  Attendees:
    root: src/features/Attendees/
    entry: src/pages/Attendees.jsx
    edit_api: GET|PATCH /events/:eventId/attendees/:uuid/ (full body PATCH)
    type_emails_api: GET /events/:eventId/attendee_types/emails/; POST .../send_email/ (204)
    category_emails_api: >
      GET /events/:eventId/category_types/emails/;
      POST .../category_types/send_email/ with email_ids (204)
    active_badge_api: >
      POST /events/:eventId/attendees/active_badge/status/;
      POST /events/:eventId/attendees/active_badge/;
      body all_without_active:true or ids/uuids/badges
    csv_upload_api: >
      POST /events/:eventId/attendees/upload/ (multipart, async);
      POST /events/:eventId/attendees/upload/validate/ (multipart, dry-run, zero writes,
      ?export=csv for report download) - see task attendee_csv_upload
    upload_history_api: >
      GET /events/:eventId/attendee/upload/report/ - see task event_uploads
  Companies:
    root: src/features/Companies/
    entry: src/pages/Companies.jsx
    page: src/features/Companies/ui/CompaniesPage.jsx
    detail_entry: src/pages/CompanyDetails.jsx
    api: POST /events/:eventId/companies/ (multipart, Token auth)
    overview_api: GET /exhibitor/events/:eventId/overview/?company_id=
    password_reset_api: POST /events/:eventId/exhibitor/password/reset/
    bulk_action_api: PATCH /events/:eventId/companies/bulk-action/
    list_api: GET /evc/events/:eventId/company_list/?sort_by=&sort_order=
    exhibitor_report_api: >
      GET /events/:eventId/exhibitor/report/ CSV blob or JSON email
      (send_to_emails + optional company_ids)
    engagement_api: >
      GET /events/:eventId/exhibitor/engagement/ JSON funnel (?refresh=true);
      CSV ?format=csv; email ?send_to_emails= (never with format=csv);
      optional completed=yes|no, include_matchmaking_questions, and
