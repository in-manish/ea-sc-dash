glossary:
  theme_color_code: Top-level event hex brand color (#RRGGBB); General settings picker + live preview; PATCH with event save
  dashboard_datetime: Display timestamps with en-IN + Asia/Kolkata; empty/invalid → em dash
  auth_landing_resume: Bare host URL must restore an existing EA/SC token instead of forcing /login
  cross_tab_logout: Other tabs keep a sessionStorage copy after logout; drop it when localStorage token is gone

  attendee_edit_full_patch: PATCH must mirror GET then change fields; not sparse. Send attendee_type as name string.
  attendee_type_draft_save: Email POST 201 is success; chained SMS errors must not mark the save failed. Empty 2xx JSON is success.
  badge_email_tokens: Bare tokens user_name/att_type/reg_id/event_code/event_name/user_email/company_name/event_date/event_venue/tv_referral_link/{title_slug}_referral_link; calendar_link_google and calendar_link_outlook as href-only; \\n becomes a real newline
  attendee_type_email_list: Send Mail Badge Email POSTs send_email/; View lists GET attendee_types/emails/
  attendee_category_email_list: Send Mail lists GET category_types/emails/; toggles POST category_types/send_email/ with email_ids
  attendee_active_badge: >
    POST active_badge/status/ + active_badge/; all_without_active lists/creates
    contact badges without an active badge; else uuids/ids; item status
    created|already_active|skipped|failed; null evc_id syncs SnapCard first
  speaker_default_alpha_sort: When true, speakers sorted A-Z by name; when false, by speaker_sort_order
  force_attendance: Agenda session flag; block slot so meetings cannot be set during this time
  speaker_image_N: Multipart file field index aligned with speaker array
  moderator_image_N: Multipart file field index aligned with moderator array
  company_create_multipart: Must use FormData; nested product/link/media as JSON strings; always send company_name, company_detail, website
  company_edit_patch: PATCH multipart; always send company_name; only changed fields; booleans as true/false strings; logo empty string removes
  company_list_sort: company_list sort_by/sort_order; defaults space/desc; ignored when q is set or is_featured=true with no q
  company_setup_progress: Overview API only; organizer must pass company_id; hide when setup_checklist.visible=false; soft-fail
  sc_card_id: Use CONTACT_SAVED card_id for admin restore/delete — not the contact user id
  sc_card_archived: GET cards/?archived=1 returns deleted_at + delete_reason (USER|SYNC|BLOCK|ADMIN)
  sc_email_template_filters: List response filters are unscoped dropdown suggestions; query params filter results only
  sc_email_from_sender_name: Optional Mandrill from-name / {{ event_name }}; empty uses settings default; GET is always effective name
  sc_email_template_archive: No DELETE; PATCH {is_active:false} archives; uniqueness applies only to active rows
  app_alert: Themed AlertModal via useAlert; window.alert is patched; confirm uses showConfirm
  wa_template_archive: DELETE /wa/template/:id/ sets is_active false; list omit is_active = active; restore PATCH { is_active: true }
  email_campaign_list: >
    GET /events/:id/campaigns/email/?page= only; no search/status filter; History/Scheduled
    tab with All/History/Scheduled client filter; row-hover View details / View recipients;
    detail and recipients extra GETs; Date column Created + Updated (Scheduled line if scheduled);
    list `count` shown beside filter; Recipients column is number_recipients
  image_editor_canvas: Event Utils Config /event/:id/image-editor Fabric.js workspace; images stay in the browser; copy/download flatten only at export (identity viewport + artboard crop). AVIF download uses libavif WASM because canvas.toBlob('image/avif') is PNG in Chrome/Brave.
  image_editor_export_format: >
    useImageEditor "Optimize for web" exports WebP (JPEG fallback). Compression slider
    (0% = higher quality, 100% = smaller file) plus optional target KB; encoder lowers
    quality then downscales to aim at or under the target. Unchecked + 0% compression
    and no target keeps PNG lossless. Filename extension matches output type.
  ea_email_file_import: Browse .html/.htm/.txt (1 MB); extract body + style; append or replace into category/template body
  ea_email_template_filters: List filters { events: [id], template_types: [unique], names: [] }; query event, name, template_type; dropdown merges known EA types
  ea_email_template_types: Known EA EmailTemplateType catalog in emailTemplateTypes.js; one template per type per event; create prefills type
  ea_email_content_variables: Create/update content_variables is { token: "" } from {{name}} in body/subject; supporting_variables catalog is shown on edit
  ea_email_invitee_link_placeholder: Title → invitee_<slug>_link (EA space-to-underscore slug); session-persisted per event
  ar_tax_list: exhibitor_portal_data.additional_requirement.tax is [{name, rate}, ...]; PATCH replaces the whole list; [] means no tax
  event_branding_images: >
    PATCH /events/:id/ ImageFields meta_logo, logo, logo2, event_banner_logo,
    event_background_image, floor_plan, meetingdiary_portal_bg_image; GET public URLs
    (floor_plan_url); skip URL strings on save; new Files uploaded; thumbnails + lightbox preview
  exhibitor_portal_meeting_diary: exhibitor_portal_data.meeting_diary.is_meeting_option_active toggles the exhibitor portal meeting diary option (default false)
  complimentary_invitee_link_is_active: Per-link is_active (default true); false hides the link from exhibitors without deleting it
  exhibitor_poc_password_reset: POST /events/:id/exhibitor/password/reset/; identify POC with badge_id then company_id; skip email/bulk_email for now
  company_bulk_action: PATCH /events/:id/companies/bulk-action/; lock_company single|multiple|all (parents); feature_company single|multiple; unfeatured rank is 0
  exhibitor_csv_report: >
    GET /events/:id/exhibitor/report/; parent rows; CSV blob or send_to_emails
    JSON; optional company_ids; 401/403/404/500
  exhibitor_engagement_csv: >
    GET /events/:id/exhibitor/engagement/?format=csv or ?send_to_emails=;
    optional completed=yes|no (omit = all), include_matchmaking_questions
    (default true; question columns + selected option names or text),
    and include_login_info (default false; POC Logged In / POC First Login);
    email is always JSON and queued; never send format=csv
    with send_to_emails; filename exhibitor-engagement_{id}_…_IST.csv;
    400 invalid completed/emails
  meeting_stats_report: >
    GET|POST /meetings/stats/report/; event × attendee_type; sent + received
    request columns; sender/receiver type names AND; cache per filters 10 min
  visiq: >
    Tenant CRM under /visiq/; subscribers list/detail + async CSV/Excel imports;
    preview JSON + file download; local CSV preview before upload
  event_uploads: >
    Sidebar /event/:id/uploads; Attendees tab GET attendee/upload/report/;
    Companies tab GET company/upload/ ({total, results[]}); shared table UI
