features:
  Companies:
    root: src/features/Companies/
    entry: src/pages/Companies.jsx
    detail_entry: src/pages/CompanyDetails.jsx
    api: POST /events/:eventId/companies/ (multipart, Token auth)
    overview_api: GET /exhibitor/events/:eventId/overview/?company_id=
    checklist_reminder_api: GET|PATCH /events/:eventId/exhibitor-setup-checklist/; GET .../exhibitor/setup-checklist/reminders/
  Agenda:
    root: src/features/Agenda/
    entry: src/pages/event-agenda/index.jsx
    edit_entry: src/pages/event-agenda/AgendaEdit.jsx
  ScManageUsers:
    root: src/features/ScManageUsers/
    entry: src/sc/pages/ManageUsers.jsx
    detail_entry: src/sc/pages/UserDetails.jsx
    routes:
      - /users/manage
      - /users/manage/:userId
    cards_api: /evc/admin/users/{userId}/cards/

critical_paths:
  - src/services/agendaService.js
  - src/features/Companies/api/companyApi.js
  - src/App.jsx

glossary:
  speaker_default_alpha_sort: When true, speakers sorted A-Z by name; when false, by speaker_sort_order
  speaker_image_N: Multipart file field index aligned with speaker array
  moderator_image_N: Multipart file field index aligned with moderator array
  company_create_multipart: Must use FormData; nested product/link/media as JSON strings; always send company_name, company_detail, website
  company_edit_patch: PATCH multipart; always send company_name; only changed fields; booleans as true/false strings; logo empty string removes
  company_setup_progress: Overview API only; organizer must pass company_id; hide when setup_checklist.visible=false; soft-fail
  sc_card_id: Use CONTACT_SAVED card_id for admin restore/delete — not the contact user id
  sc_card_archived: GET cards/?archived=1 returns deleted_at + delete_reason (USER|SYNC|BLOCK|ADMIN)
