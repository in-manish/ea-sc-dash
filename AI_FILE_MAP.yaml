    notes: >
      Fabric.js editor listed under event sidebar Utils Config. Local-only;
      event id is only for the layout shell, not image APIs.
      Distinct from src/components/imageEditor/ crop modal.
      Workspace host must fill the flex column (absolute inset-0).
      A zero-height host keeps Fabric at 300x150 so the photo looks tiny.
      AVIF export: Chrome/Brave decode AVIF but canvas.toBlob('image/avif')
      returns PNG. Encode with @jsquash/avif (libavif WASM) after flatten.
      Export resets viewport to 1:1 and crops to the artboard/image.
      Crop tool shows Apply crop on the canvas (Enter/Esc). Crop tab and
      crop tool both start a crop box; custom W×H resizes that box.
