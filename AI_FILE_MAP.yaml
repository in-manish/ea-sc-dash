glossary:
  auth_landing_resume: Bare host URL must restore an existing EA/SC token instead of forcing /login

  attendee_edit_full_patch: PATCH must mirror GET then change fields; not sparse. Send attendee_type as name string.
  speaker_default_alpha_sort: When true, speakers sorted A-Z by name; when false, by speaker_sort_order
  speaker_image_N: Multipart file field index aligned with speaker array
  moderator_image_N: Multipart file field index aligned with moderator array
  company_create_multipart: Must use FormData; nested product/link/media as JSON strings; always send company_name, company_detail, website
  company_edit_patch: PATCH multipart; always send company_name; only changed fields; booleans as true/false strings; logo empty string removes
  company_setup_progress: Overview API only; organizer must pass company_id; hide when setup_checklist.visible=false; soft-fail
  sc_card_id: Use CONTACT_SAVED card_id for admin restore/delete — not the contact user id
  sc_card_archived: GET cards/?archived=1 returns deleted_at + delete_reason (USER|SYNC|BLOCK|ADMIN)
  sc_email_template_filters: List response filters are unscoped dropdown suggestions; query params filter results only
  sc_email_from_sender_name: Optional Mandrill from-name / {{ event_name }}; empty uses settings default; GET is always effective name
  sc_email_template_archive: No DELETE; PATCH {is_active:false} archives; uniqueness applies only to active rows
  ea_email_file_import: Browse .html/.htm/.txt (1 MB); extract body + style; append or replace into category/template body
  ea_email_template_filters: List filters { events: [id], template_types: [unique], names: [] }; query event, name, template_type
  ea_email_content_variables: Create/update content_variables is { token: "" } from {{name}} in body/subject; supporting_variables catalog is shown on edit
  ar_tax_list: exhibitor_portal_data.additional_requirement.tax is [{name, rate}, ...]; PATCH replaces the whole list; [] means no tax
  exhibitor_poc_password_reset: POST /events/:id/exhibitor/password/reset/; identify POC with badge_id then company_id; skip email/bulk_email for now
  company_bulk_action: PATCH /events/:id/companies/bulk-action/; lock_company single|multiple|all (parents); feature_company single|multiple; unfeatured rank is 0
