      - src/components/imageEditor/index.js
      - src/App.jsx
    notes: >
      Domain-agnostic crop/resize/optimize modal (cropperjs, MIT) for any image-upload
      field. Wrap the app with ImageEditorProvider; call useImageEditor().editImage(fileOrUrl, config).
      Resolves with the processed File, or null on cancel. A URL string is fetched into a File
      (direct, then `/__image-file` proxy). Non-images pass through.
      Default crop is free: width and height are independent (drag edges or type px).
      Compression slider (0-100%) and optional target size in KB; live preview encodes to
      WebP/JPEG and, if still over target, lowers quality then scales down.
      config per call site: aspectRatios (NaN = free), recommended web/mobile size hints,
      maxOutputDim, allowOptimize / defaultOptimize. config.enabled === false bypasses.
      Call sites: event branding, company logo, agenda speaker/moderator photos, AR product
      photo, certificate template, badge email template, document thumbnail, floating file
      upload (images only).
