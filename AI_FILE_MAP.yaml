    notes: >
      Tab Event Images. PATCH /events/:id/ multipart ImageFields: meta_logo, logo, logo2,
      event_banner_logo, event_background_image, floor_plan,
      meetingdiary_portal_bg_image. GET returns public URLs (floor_plan_url).
      Existing URL strings are not re-sent; new Files are (incl. AVIF). Thumbnails + lightbox
      preview. URL banners use EventImageUrlPreviewField (meeting_email_banner_link).
      Picking a new image opens the crop/resize/optimize modal. Edit image loads the
      current File or saved URL into the same modal (dev GET proxy `/__image-file`).
      Each field also shows file size, dimensions, format, and a web-optimize hint.
      The "Web optimized" chip is green. "Heavy" means file KB over the web target —
      large pixel dimensions with a small AVIF/WebP do not fail.
  image_editor_reusable:
    files:
