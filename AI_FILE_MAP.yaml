    notes: >
      GET /events/:eventId/exhibitor/engagement/. Cached ~5 minutes.
      refresh=true skips cache, recomputes, and recaches. Funnel JSON is
      parent exhibitors only. CSV/email rows are parents and co-exhibitors.
      JSON also returns total_logged_in_pocs, logged_in_exhibitor_pocs,
      logged_in_coexhibitor_pocs (parents + co-exhibitors). Steps use
      exhibitor_count when present else count; percentage of
      total_exhibitors. invites_sent may include by_type (invite count per
      label); UI shows Invites sent from API and Registered/Accepted as N/A.
      from_cache true on hit. 401 login; 403 organizer; 404 event; 500 retry.
      Engagement report (not Matchmaking CSV): format=csv + optional
      completed=yes|no (omit = all) + include_matchmaking_questions=true|false
      (default true) + include_login_info=true|false (default false). When
      questions true, each portal question is a CSV column; cells are
      selected option names (comma-separated) or the text answer. When
      login info true, POC Logged In / POC First Login follow Registered
      Email. Email: send_to_emails (required, never format=csv) + same
      optional params; always JSON; queued async. Filename from
      Content-Disposition (exhibitor-engagement_{id}_YYYY-MM-DD_HHMMSS_IST.csv).
      completed is case-insensitive; invalid → 400. Do not send format=csv
      with send_to_emails.
